<svg xmlns="http://www.w3.org/2000/svg" viewBox="776.861 154.202 650.000 520.292" role="img" width="650" height="520.292"><g><text x="790" y="185" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Rúmmál sívalnings</text>
<text x="790" y="233" font-family="Cambria, Georgia, serif" font-size="43" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">R</tspan>₁ = π<tspan font-style="italic">r</tspan>²<tspan font-style="italic">h</tspan></text>
<text x="790" y="310" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Rúmmál hálfkúlu</text>
<text x="790" y="367" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">R</tspan>₂ = </text>
<text x="926.84" y="346" font-family="Cambria, Georgia, serif" font-size="37.4" text-anchor="middle" dominant-baseline="central" fill="#353A32">2</text>
<text x="926.84" y="392" font-family="Cambria, Georgia, serif" font-size="37.4" text-anchor="middle" dominant-baseline="central" fill="#353A32">3</text>
<path d="M 904.4 369 L 949.2800000000001 369" fill="none" stroke="#353A32" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" />
<text x="963.2800000000001" y="367" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32">π<tspan font-style="italic">r</tspan>³</text>
<text x="790" y="470" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Heildarrúmmál</text>
<text x="790" y="518" font-family="Cambria, Georgia, serif" font-size="43" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">R</tspan> = <tspan font-style="italic">R</tspan>₁ + <tspan font-style="italic">R</tspan>₂</text>
<text x="790" y="590" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Ytra yfirborð með botni</text>
<text x="790" y="638" font-family="Cambria, Georgia, serif" font-size="42" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">Y</tspan> = 2π<tspan font-style="italic">r</tspan><tspan font-style="italic">h</tspan> + 3π<tspan font-style="italic">r</tspan>²</text>
</g><title>Sívalningur með hálfkúlu ofan á — formúlur</title></svg>