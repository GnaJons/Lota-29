<svg xmlns="http://www.w3.org/2000/svg" viewBox="775.721 164.202 650.000 524.747" role="img" width="650" height="524.747"><g><text x="790" y="195" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Regla Pýþagórasar af formúlublaðinu</text>
<text x="790" y="243" font-family="Cambria, Georgia, serif" font-size="43" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">a</tspan>² + <tspan font-style="italic">b</tspan>² = <tspan font-style="italic">c</tspan>²</text>
<text x="790" y="350" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Beitt á grunnflöt kassans</text>
<text x="790" y="398" font-family="Cambria, Georgia, serif" font-size="43" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">a</tspan>² + <tspan font-style="italic">b</tspan>² = <tspan font-style="italic">AC</tspan>²</text>
<text x="790" y="505" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Beitt inni í kassanum</text>
<text x="790" y="553" font-family="Cambria, Georgia, serif" font-size="43" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">AC</tspan>² + <tspan font-style="italic">h</tspan>² = <tspan font-style="italic">AD</tspan>²</text>
<text x="790" y="620" font-family="Cambria, Georgia, serif" font-size="28" text-anchor="start" dominant-baseline="central" fill="#73766A">Taktu jákvæða ferningsrót</text>
<text x="790" y="661" font-family="Cambria, Georgia, serif" font-size="28" text-anchor="start" dominant-baseline="central" fill="#73766A">til að finna lengd hornalínunnar AD.</text>
</g><title>Hornalína í kassa — formúlur</title></svg>