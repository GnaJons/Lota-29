<svg xmlns="http://www.w3.org/2000/svg" viewBox="776.861 199.202 650.000 435.292" role="img" width="650" height="435.292"><g><text x="790" y="230" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Einn hringflötur</text>
<text x="790" y="278" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">G</tspan> = π<tspan font-style="italic">r</tspan>²</text>
<text x="790" y="390" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Rétthyrndur möttull</text>
<text x="790" y="438" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">M</tspan> = 2π<tspan font-style="italic">r</tspan><tspan font-style="italic">h</tspan></text>
<text x="790" y="550" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Allt yfirborðið</text>
<text x="790" y="598" font-family="Cambria, Georgia, serif" font-size="42" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">Y</tspan> = 2π<tspan font-style="italic">r</tspan>² + 2π<tspan font-style="italic">r</tspan><tspan font-style="italic">h</tspan></text>
</g><title>Sívalningur: tveir hringir og möttull — formúlur</title></svg>