<svg xmlns="http://www.w3.org/2000/svg" viewBox="776.861 164.202 650.000 490.292" role="img" width="650" height="490.292"><g><text x="790" y="195" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Flatarmál grunnflatar</text>
<text x="790" y="243" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">G</tspan> = π<tspan font-style="italic">r</tspan>²</text>
<text x="790" y="320" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Rúmmál</text>
<text x="790" y="368" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">R</tspan> = π<tspan font-style="italic">r</tspan>²<tspan font-style="italic">h</tspan></text>
<text x="790" y="445" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Flatarmál möttuls</text>
<text x="790" y="493" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">M</tspan> = 2π<tspan font-style="italic">r</tspan><tspan font-style="italic">h</tspan></text>
<text x="790" y="570" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Yfirborðsflatarmál</text>
<text x="790" y="618" font-family="Cambria, Georgia, serif" font-size="42" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">Y</tspan> = 2π<tspan font-style="italic">r</tspan>² + 2π<tspan font-style="italic">r</tspan><tspan font-style="italic">h</tspan></text>
</g><title>Sívalningur — formúlur</title></svg>