<svg xmlns="http://www.w3.org/2000/svg" viewBox="776.861 189.202 650.000 437.570" role="img" width="650" height="437.57"><g><text x="790" y="220" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Allar lengdir margfaldast með k</text>
<text x="790" y="268" font-family="Cambria, Georgia, serif" font-size="39" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">l</tspan>₂ = <tspan font-style="italic">k</tspan><tspan font-style="italic">l</tspan>₁</text>
<text x="790" y="380" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Flatarmál margfaldast með k²</text>
<text x="790" y="428" font-family="Cambria, Georgia, serif" font-size="46" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">Y</tspan>₂ = <tspan font-style="italic">k</tspan>²<tspan font-style="italic">Y</tspan>₁</text>
<text x="790" y="540" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Rúmmál margfaldast með k³</text>
<text x="790" y="588" font-family="Cambria, Georgia, serif" font-size="46" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">R</tspan>₂ = <tspan font-style="italic">k</tspan>³<tspan font-style="italic">R</tspan>₁</text>
</g><title>Einslaga rúmhlutir — formúlur</title></svg>