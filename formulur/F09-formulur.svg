<text x="790" y="470" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Heildarrúmmál</text>
<text x="790" y="518" font-family="Cambria, Georgia, serif" font-size="43" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">R</tspan> = <tspan font-style="italic">R</tspan>₁ + <tspan font-style="italic">R</tspan>₂</text>
<text x="790" y="590" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Ytra yfirborð með loki</text>
<text x="790" y="638" font-family="Cambria, Georgia, serif" font-size="38" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">Y</tspan> = 2π<tspan font-style="italic">r</tspan><tspan font-style="italic">h</tspan>₁ + π<tspan font-style="italic">r</tspan><tspan font-style="italic">s</tspan> + π<tspan font-style="italic">r</tspan>²</text>
