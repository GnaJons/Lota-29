<svg xmlns="http://www.w3.org/2000/svg" viewBox="776.861 154.202 650.000 518.013" role="img" width="650" height="518.013"><g><text x="790" y="185" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Rúmmál sívalnings</text>
<text x="790" y="233" font-family="Cambria, Georgia, serif" font-size="43" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">R</tspan>₁ = π<tspan font-style="italic">r</tspan>²<tspan font-style="italic">h</tspan>₁</text>
<text x="790" y="320" font-family="Cambria, Georgia, serif" font-size="32" text-anchor="start" dominant-baseline="central" fill="#73766A">Rúmmál keilu</text>
<text x="790" y="377" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">R</tspan>₂ = </text>
<text x="926.84" y="356" font-family="Cambria, Georgia, serif" font-size="37.4" text-anchor="middle" dominant-baseline="central" fill="#353A32">1</text>
<text x="926.84" y="402" font-family="Cambria, Georgia, serif" font-size="37.4" text-anchor="middle" dominant-baseline="central" fill="#353A32">3</text>
