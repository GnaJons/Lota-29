<text x="65" y="825" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">Formúlur sívalnings eru notaðar fyrir helming hans; botnflöturinn bætist við.</text></svg>