<text x="65" y="784" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">Teningur er réttstrendingur með jafnlangar brúnir: l = b = h.</text>
<text x="65" y="825" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">Notaðu sömu lengd fyrir l, b og h í formúlum réttstrendingsins.</text></svg>