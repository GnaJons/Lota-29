<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img"><title>Hálfkúla með botni</title><rect width="100%" height="100%" fill="#fff"/><text x="64" y="40" font-family="Cambria, Georgia, serif" font-size="22" text-anchor="start" dominant-baseline="central" fill="#73766A">5. TÍMI · KÚLUR</text>
<text x="64" y="99" font-family="Cambria, Georgia, serif" font-size="47" text-anchor="start" dominant-baseline="central" fill="#353A32">Hálfkúla með botni</text>
<path d="M 110 370 A 225 225 0 0 0 560 370 Z" fill="#E4E8D6" stroke="#353A32" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="335" cy="370" rx="225" ry="53" fill="#EDDCB9" stroke="#353A32" stroke-width="2.7"/>
<path d="M 335 370 L 560 370" fill="none" stroke="#A26D3D" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/>
<ellipse cx="335" cy="370" rx="4" ry="4" fill="#A26D3D" stroke="none" stroke-width="2.7"/>
<text x="447.5" y="343" font-family="Cambria, Georgia, serif" font-size="36" text-anchor="middle" dominant-baseline="central" fill="#A26D3D"><tspan font-style="italic">r</tspan></text>
<text x="790" y="185" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Rúmmál</text>
<text x="790" y="242" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">R</tspan> = </text>
<text x="903.96" y="221" font-family="Cambria, Georgia, serif" font-size="37.4" text-anchor="middle" dominant-baseline="central" fill="#353A32">2</text>
<text x="903.96" y="267" font-family="Cambria, Georgia, serif" font-size="37.4" text-anchor="middle" dominant-baseline="central" fill="#353A32">3</text>
<path d="M 881.52 244 L 926.4000000000001 244" fill="none" stroke="#353A32" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="940.4000000000001" y="242" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32">π<tspan font-style="italic">r</tspan>³</text>
<text x="790" y="330" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Yfirborð með botni</text>
<text x="790" y="378" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">Y</tspan><tspan font-style="italic">F</tspan> = 3π<tspan font-style="italic">r</tspan>²</text>
<text x="790" y="455" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Flatur hringbotn</text>
<text x="790" y="503" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">F</tspan> = π<tspan font-style="italic">r</tspan>²</text>
<text x="790" y="580" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Án botns: drögum botnflötinn frá</text>
<text x="790" y="628" font-family="Cambria, Georgia, serif" font-size="39" text-anchor="start" dominant-baseline="central" fill="#353A32">3π<tspan font-style="italic">r</tspan>² − π<tspan font-style="italic">r</tspan>² = 2π<tspan font-style="italic">r</tspan>²</text>
<path d="M 65 744 L 1370 744" fill="none" stroke="#E4E5DD" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="65" y="784" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">Okkurguli flöturinn er hringbotninn.</text>
<text x="65" y="825" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">Án botns er yfirborðsflatarmálið 2πr²; með botni er það 3πr².</text></svg>