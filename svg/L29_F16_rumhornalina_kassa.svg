<text x="790" y="195" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Regla Pýþagórasar af formúlublaðinu</text>
<text x="790" y="243" font-family="Cambria, Georgia, serif" font-size="43" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">a</tspan>² + <tspan font-style="italic">b</tspan>² = <tspan font-style="italic">c</tspan>²</text>
<text x="790" y="350" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Beitt á grunnflöt kassans</text>
<text x="790" y="398" font-family="Cambria, Georgia, serif" font-size="43" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">l</tspan>² + <tspan font-style="italic">b</tspan>² = <tspan font-style="italic">p</tspan>²</text>
<text x="790" y="505" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Beitt inni í kassanum</text>
<text x="790" y="553" font-family="Cambria, Georgia, serif" font-size="43" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">p</tspan>² + <tspan font-style="italic">h</tspan>² = <tspan font-style="italic">d</tspan>²</text>
<text x="790" y="620" font-family="Cambria, Georgia, serif" font-size="28" text-anchor="start" dominant-baseline="central" fill="#73766A">Taktu jákvæða ferningsrót</text>
<text x="790" y="661" font-family="Cambria, Georgia, serif" font-size="28" text-anchor="start" dominant-baseline="central" fill="#73766A">til að finna lengdina d.</text>
<path d="M 65 744 L 1370 744" fill="none" stroke="#E4E5DD" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="65" y="784" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">p liggur í grunnfletinum; d tengir tvö gagnstæð horn gegnum kassann.</text>
<text x="65" y="825" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">Regla Pýþagórasar er notuð tvisvar.</text></svg>