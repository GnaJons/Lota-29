<text x="330" y="400" font-family="Cambria, Georgia, serif" font-size="35" text-anchor="middle" dominant-baseline="central" fill="#353A32">2π<tspan font-style="italic">r</tspan></text>
<text x="330" y="477" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="middle" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">M</tspan></text>
<text x="330" y="637" font-family="Cambria, Georgia, serif" font-size="40" text-anchor="middle" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">F</tspan></text>
<text x="330" y="297" font-family="Cambria, Georgia, serif" font-size="34" text-anchor="middle" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">F</tspan></text>
<path d="M 565.1946710584651 335 L 620 335" fill="none" stroke="#979B89" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 565.1946710584651 565 L 620 565" fill="none" stroke="#979B89" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
