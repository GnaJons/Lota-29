<path d="M 610 335 L 606.4 345 L 613.6 345 Z" fill="#73766A" stroke="none" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="640" y="450" font-family="Cambria, Georgia, serif" font-size="34" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">h</tspan></text>
<text x="790" y="230" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Einn hringflötur</text>
<text x="790" y="278" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">F</tspan> = π<tspan font-style="italic">r</tspan>²</text>
<text x="790" y="390" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Rétthyrndur möttull</text>
<text x="790" y="438" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">M</tspan> = 2π<tspan font-style="italic">r</tspan><tspan font-style="italic">h</tspan></text>
<text x="790" y="550" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Allt yfirborðið</text>
<text x="790" y="598" font-family="Cambria, Georgia, serif" font-size="42" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">Y</tspan><tspan font-style="italic">F</tspan> = 2π<tspan font-style="italic">r</tspan>² + 2π<tspan font-style="italic">r</tspan><tspan font-style="italic">h</tspan></text>
<path d="M 65 744 L 1370 744" fill="none" stroke="#E4E5DD" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="65" y="784" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">Lengd rétthyrningsins er ummál grunnhringsins: U = 2πr.</text>
<text x="65" y="825" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">Hæð rétthyrningsins er hæð sívalningsins.</text></svg>