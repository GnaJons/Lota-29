<ellipse cx="330" cy="270" rx="4" ry="4" fill="#A26D3D" stroke="none" stroke-width="2.7"/>
<text x="420" y="244" font-family="Cambria, Georgia, serif" font-size="36" text-anchor="middle" dominant-baseline="central" fill="#A26D3D"><tspan font-style="italic">r</tspan></text>
<path d="M 519 270 L 585 270" fill="none" stroke="#979B89" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 519 620 L 585 620" fill="none" stroke="#979B89" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
