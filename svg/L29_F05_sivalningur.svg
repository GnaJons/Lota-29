<path d="M 575 270 L 571.4 280 L 578.6 280 Z" fill="#73766A" stroke="none" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="605" y="445" font-family="Cambria, Georgia, serif" font-size="36" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">h</tspan></text>
<text x="790" y="195" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Flatarmál grunnflatar</text>
<text x="790" y="243" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">F</tspan> = π<tspan font-style="italic">r</tspan>²</text>
<text x="790" y="320" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Rúmmál</text>
<text x="790" y="368" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">R</tspan> = π<tspan font-style="italic">r</tspan>²<tspan font-style="italic">h</tspan></text>
<text x="790" y="445" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Möttull</text>
<text x="790" y="493" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">M</tspan> = 2π<tspan font-style="italic">r</tspan><tspan font-style="italic">h</tspan></text>
<text x="790" y="570" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Yfirborðsflatarmál</text>
<text x="790" y="618" font-family="Cambria, Georgia, serif" font-size="42" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">Y</tspan><tspan font-style="italic">F</tspan> = 2π<tspan font-style="italic">r</tspan>² + 2π<tspan font-style="italic">r</tspan><tspan font-style="italic">h</tspan></text>
<path d="M 65 744 L 1370 744" fill="none" stroke="#E4E5DD" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="65" y="784" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">r er radíus, h er hæð og þvermálið er þ = 2r.</text>
<text x="65" y="825" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">Heilt yfirborð sívalnings samanstendur af tveimur hringflötum og möttli.</text></svg>