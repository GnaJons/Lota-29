<text x="425" y="480" font-family="Cambria, Georgia, serif" font-size="36" text-anchor="middle" dominant-baseline="central" fill="#A26D3D"><tspan font-style="italic">r</tspan></text>
<text x="462" y="340" font-family="Cambria, Georgia, serif" font-size="37" text-anchor="middle" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">l</tspan></text>
<text x="790" y="190" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Möttull keilu</text>
<text x="790" y="238" font-family="Cambria, Georgia, serif" font-size="44" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">M</tspan> = π<tspan font-style="italic">r</tspan><tspan font-style="italic">l</tspan></text>
<text x="790" y="325" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Hálfkúla: botnflöturinn dreginn frá</text>
<text x="790" y="373" font-family="Cambria, Georgia, serif" font-size="43" text-anchor="start" dominant-baseline="central" fill="#353A32">3π<tspan font-style="italic">r</tspan>² − π<tspan font-style="italic">r</tspan>²</text>
<text x="790" y="460" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Samsett ytra yfirborð</text>
<text x="790" y="508" font-family="Cambria, Georgia, serif" font-size="43" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">Y</tspan><tspan font-style="italic">F</tspan> = π<tspan font-style="italic">r</tspan><tspan font-style="italic">l</tspan> + 2π<tspan font-style="italic">r</tspan>²</text>
<text x="790" y="590" font-family="Cambria, Georgia, serif" font-size="25" text-anchor="start" dominant-baseline="central" fill="#73766A">Leggjum saman rúmmálsformúlurnar</text>
<text x="790" y="650" font-family="Cambria, Georgia, serif" font-size="40" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">R</tspan> = </text>
<text x="888" y="630" font-family="Cambria, Georgia, serif" font-size="34" text-anchor="middle" dominant-baseline="central" fill="#353A32">1</text>
<text x="888" y="674" font-family="Cambria, Georgia, serif" font-size="34" text-anchor="middle" dominant-baseline="central" fill="#353A32">3</text>
<path d="M 872 652 L 904 652" fill="none" stroke="#353A32" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="917" y="650" font-family="Cambria, Georgia, serif" font-size="40" text-anchor="start" dominant-baseline="central" fill="#353A32"><tspan font-style="italic">h</tspan>π<tspan font-style="italic">r</tspan>² +</text>
<text x="1088" y="630" font-family="Cambria, Georgia, serif" font-size="34" text-anchor="middle" dominant-baseline="central" fill="#353A32">2</text>
<text x="1088" y="674" font-family="Cambria, Georgia, serif" font-size="34" text-anchor="middle" dominant-baseline="central" fill="#353A32">3</text>
