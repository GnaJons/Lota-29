<text x="1117" y="650" font-family="Cambria, Georgia, serif" font-size="40" text-anchor="start" dominant-baseline="central" fill="#353A32">π<tspan font-style="italic">r</tspan>³</text>
<path d="M 65 744 L 1370 744" fill="none" stroke="#E4E5DD" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="65" y="784" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">Keilan og hálfkúlan hafa sama radíus r.</text>
<text x="65" y="825" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">Sameiginlegi hringflöturinn er inni í hlutnum og telst ekki með ytra yfirborði.</text></svg>