<text x="65" y="784" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">G er flatarmál þríhyrnds grunnflatar. h er fjarlægðin milli grunnflatanna.</text>
<text x="65" y="825" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">U er ummál þríhyrningsins, þ.e. summa allra þriggja hliðarlengda.</text></svg>