<text x="65" y="825" font-family="Cambria, Georgia, serif" font-size="27" text-anchor="start" dominant-baseline="central" fill="#73766A">U er ummál grunnflatar. YF er samanlagt flatarmál allra sex flata kassans.</text></svg>